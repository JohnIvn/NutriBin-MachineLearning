name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.10, 3.11]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest flake8 || true
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f yolo/requirements.txt ]; then pip install -r yolo/requirements.txt; fi
          if [ -f tflite/requirements.txt ]; then pip install -r tflite/requirements.txt; fi

      - name: Lint (flake8)
        run: |
          if command -v flake8 >/dev/null 2>&1; then flake8 || true; else echo "flake8 not available, skipping"; fi

      - name: Run tests (pytest)
        run: |
          if [ -d tests ]; then pytest -q; else echo "No pytest tests found; skipping"; fi
